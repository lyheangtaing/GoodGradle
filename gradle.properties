# Conservative starting point; tune heap/workers with Build Analyzer.
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# AGP 9 defaults include built-in Kotlin, AndroidX, non-transitive R and
# optimized resource shrinking. Avoid obsolete or experimental flags.
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
