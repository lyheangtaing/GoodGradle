version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
      compose:
        patterns:
          - androidx.compose*
      android-test:
        patterns:
          - androidx.test*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
